# A generic, single-database Alembic configuration.
# This file is loaded by ``alembic/env.py`` — most settings are read from
# environment / ``app.config.Settings`` rather than hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
# ``sqlalchemy.url`` is provided dynamically by env.py from the Settings singleton.
# Setting it here is required for ``alembic`` CLI happy-path but the runtime
# always overrides it.
sqlalchemy.url = mysql+aiomysql://placeholder

# File template for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Don't emit the standard timestamp/sha header (we keep the file small and
# the slug useful).
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
